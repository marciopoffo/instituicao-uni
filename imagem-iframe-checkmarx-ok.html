Teste BB
<div id="viewer"></div>
 
<script src="https://cdn.jsdelivr.net/npm/tiff.js/tiff.min.js"></script>

<script>
// Lista branca de origens permitidas (ajuste para os domínios reais)
const ALLOWED_ORIGINS = new Set([
  "https://localhost",
  "http://localhost",
  "http://127.0.0.1:5500" // se estiver usando live server
]);

// Validador de Base64 (opcional, mas ajuda a filtrar entradas inválidas ou malformadas)
const BASE64_REGEX = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/;

// Limite de tamanho (ex.: 20MB em base64 ≈ 26,6MB de string; ajuste)
const MAX_BASE64_LENGTH = 28_000_000;


/*
type TiffMessage = {
  type: "TIFF_PAYLOAD";     // sentinel para evitar colisões com outras mensagens
  tiffBase64: string;       // conteúdo esperado
  // opcionalmente adicione um checksum, versão, etc.
};

function isTiffMessage(data: unknown): data is TiffMessage {
  if (typeof data !== "object" || data === null) return false;
  const d = data as Record<string, unknown>;
  return d.type === "TIFF_PAYLOAD" && typeof d.tiffBase64 === "string";
}
*/
function isTiffMessage(data) {
  if (typeof data !== "object" || data === null) return false;

  return (
    data.type === "TIFF_PAYLOAD" &&
    typeof data.tiffBase64 === "string"
  );
}


/*
function isSafeBase64(b64: string): boolean {
  // tamanho razoável e formato válido
  if (b64.length === 0 || b64.length > MAX_BASE64_LENGTH) return false;
  // Remova prefixos como "data:...;base64," se seu fluxo não enviar isso
  return BASE64_REGEX.test(b64);
}
*/

function isSafeBase64(b64) {
  if (typeof b64 !== "string") return false;

  if (b64.length === 0 || b64.length > MAX_BASE64_LENGTH) return false;

  return BASE64_REGEX.test(b64);
}



//window.addEventListener("message", (event: MessageEvent) => {
window.addEventListener("message", (event) => {
  try {
    // 1) Verificar a origem
    if (!ALLOWED_ORIGINS.has(event.origin)) {
      // Opcional: registrar, contar métricas, etc.
      return;
    }

    // 2) (Opcional) Verificar se o evento é "confiável" do ponto de vista do browser
    // Nem todo navegador define significado forte para isTrusted em postMessage,
    // então use apenas como sinal fraco.
    if (event.isTrusted === false) {
      return;
    }

    // 3) Validar estrutura do payload
    if (!isTiffMessage(event.data)) {
      return;
    }

    let base64 = event.data.tiffBase64.trim();

    // 4) Validar conteúdo/base64
    if (!isSafeBase64(base64)) {
      return;
    }
/*
    // 5) Uso seguro: NÃO injetar no DOM como HTML.
    // Se for criar um Blob e exibir, faça via URL.createObjectURL:
    const binary = atob(base64); // cuidado: pode ser grande
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: "image/tiff" });

    // Exemplo de uso seguro: criar URL de objeto para visualização/uso controlado
    const objectUrl = URL.createObjectURL(blob);

    // ... passe objectUrl para um <img>, <object> ou viewer controlado
    // Exemplo:
    // const img = document.getElementById("tiffImg") as HTMLImageElement | null;
    // if (img) img.src = objectUrl;

    // Lembre-se de revogar quando não precisar mais:
    // URL.revokeObjectURL(objectUrl);
*/


  // se vier com data:image/tiff;base64,
  if (base64.startsWith("data:")) {
    base64 = base64.split(",")[1];
  }
 
  function base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const len = binary.length;
    const buffer = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      buffer[i] = binary.charCodeAt(i);
    }
    return buffer.buffer;
  }
 
  const buffer = base64ToArrayBuffer(base64);
 
  // cria a imagem TIFF
  const tiff = new Tiff({ buffer });
 
  // a própria lib gera um canvas pronto
  const canvas = tiff.toCanvas();
 
  // adiciona na página
  document.getElementById("viewer").appendChild(canvas);




  } catch (err) {
    // Tratamento de erro sem expor detalhes sensíveis
    console.error("Falha ao processar mensagem do iframe.", err);
  }
});
</script>

</body>
